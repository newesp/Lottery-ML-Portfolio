name: Update verified lottery data
on:
  schedule:
    - cron: "15 13 * * 1,4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-lottery-data
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: lottery-ml ingest --root .
      - name: Commit verified snapshot when changed
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No verified data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw/snapshots data/manifests
          git commit -m "data: publish verified lottery snapshot"
          git push
